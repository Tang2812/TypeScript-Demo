<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cat List</title>
  <link rel="stylesheet" href="index.css">
  <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.min.css">


</head>

<body>
  <h1>Cat List</h1>
  <button class="btn btn-success btn-create">Create new Cat</button>

  <table class="table" id="cat-list">
    <thead>
      <tr>
        <th scope="col">#</th>
        <th scope="col">Name</th>
        <th scope="col">Weight</th>
        <th scope="col">Color</th>
        <th scope="col">Gender</th>
        <th scope="col">Action</th>
      </tr>
    </thead>
    <tbody>
    </tbody>
  </table>

  <form id="cat-form" class="mb-4">
    <div class="mb-3">
      <label for="name" class="form-label">Cat's Name</label>
      <input type="text" id="name" class="form-control" name="name" required>
    </div>
    <div class="mb-3">
      <label for="Weight" class="form-label">Cat's Weight</label>
      <input type="number" id="Weight" class="form-control" name="Weight" required>
    </div>
    <div class="mb-3">
      <label for="color" class="form-label">Cat's Color</label>
      <select class="form-control" id="color" name="color" required>
        <option value="gray">Gray</option>
        <option value="black">Black</option>
        <option value="white">White</option>
        <option value="orange">Orange</option>
        <option value="brown">Brown</option>
      </select>
    </div>
    <div class="mb-3">
      <label for="gender" class="form-label">Cat's Gender</label>
      <select class="form-control" id="gender" name="gender" required>
        <option value="1">male</option>
        <option value="0">female</option>
      </select>
    </div>
    <button type="submit" class="btn btn-primary">Add New Cat</button>
  </form>

  <script type="module" src="index.js"></script>

</body>

</html>
